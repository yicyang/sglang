</style><rect class="bg" width="900" height="500" rx="8"/><text x="20" y="30" class="ink" font-size="16" text-anchor="start" font-weight="600">Fused MoE gain vs baseline: kernel -&gt; step -&gt; end to end</text><text x="20" y="50" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">Improvement in % (time reduction, or QPS gain). Higher is better.</text><rect x="250" y="64" width="12" height="12" rx="3" class="s1"/><text x="268" y="74.5" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">TP2 (2 GPUs)</text><rect x="380" y="64" width="12" height="12" rx="3" class="s2"/><text x="398" y="74.5" class="ink2" font-size="12.5" text-anchor="start" font-weight="400">TP4 (4 GPUs)</text><line x1="250.0" y1="86" x2="250.0" y2="440" class="axis" stroke-width="1"/><text x="250.0" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">0%</text><line x1="348.3333333333333" y1="86" x2="348.3333333333333" y2="440" class="grid" stroke-width="1"/><text x="348.3333333333333" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">5%</text><line x1="446.66666666666663" y1="86" x2="446.66666666666663" y2="440" class="grid" stroke-width="1"/><text x="446.66666666666663" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">10%</text><line x1="545.0" y1="86" x2="545.0" y2="440" class="grid" stroke-width="1"/><text x="545.0" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">15%</text><line x1="643.3333333333333" y1="86" x2="643.3333333333333" y2="440" class="grid" stroke-width="1"/><text x="643.3333333333333" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">20%</text><line x1="741.6666666666667" y1="86" x2="741.6666666666667" y2="440" class="grid" stroke-width="1"/><text x="741.6666666666667" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">25%</text><line x1="840.0" y1="86" x2="840.0" y2="440" class="grid" stroke-width="1"/><text x="840.0" y="458" class="mut" font-size="12" text-anchor="middle" font-weight="400">30%</text><text x="236" y="114" class="ink" font-size="13" text-anchor="end" font-weight="600">Prefill MoE layer kernel</text><text x="236" y="130" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">time, M=12000, single GPU</text><path d="M250,102 H456.4333333333333 Q460.4333333333333,102 460.4333333333333,106 V112 Q460.4333333333333,116 456.4333333333333,116 H250 Z" class="s1"><title>TP2 Prefill MoE layer kernel: 10.7%</title></path><text x="466.4333333333333" y="113" class="ink2" font-size="12" text-anchor="start" font-weight="400">10.7%</text><path d="M250,118 H517.4000000000001 Q521.4000000000001,118 521.4000000000001,122 V128 Q521.4000000000001,132 517.4000000000001,132 H250 Z" class="s2"><title>TP4 Prefill MoE layer kernel: 13.8%</title></path><text x="527.4000000000001" y="129" class="ink2" font-size="12" text-anchor="start" font-weight="400">13.8%</text><text x="236" y="172" class="ink" font-size="13" text-anchor="end" font-weight="600">MoE + router kernels</text><text x="236" y="188" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">per prefill step (profile)</text><path d="M250,160 H541.0 Q545.0,160 545.0,164 V170 Q545.0,174 541.0,174 H250 Z" class="s1"><title>TP2 MoE + router kernels: 15.0%</title></path><text x="551.0" y="171" class="ink2" font-size="12" text-anchor="start" font-weight="400">15.0%</text><path d="M250,176 H747.5 Q751.5,176 751.5,180 V186 Q751.5,190 747.5,190 H250 Z" class="s2"><title>TP4 MoE + router kernels: 25.5%</title></path><text x="757.5" y="187" class="ink2" font-size="12" text-anchor="start" font-weight="400">25.5%</text><text x="236" y="230" class="ink" font-size="13" text-anchor="end" font-weight="600">Prefill step</text><text x="236" y="246" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">wall time (profile)</text><path d="M250,218 H289.26666666666665 Q293.26666666666665,218 293.26666666666665,222 V228 Q293.26666666666665,232 289.26666666666665,232 H250 Z" class="s1"><title>TP2 Prefill step: 2.2%</title></path><text x="299.26666666666665" y="229" class="ink2" font-size="12" text-anchor="start" font-weight="400">2.2%</text><path d="M250,234 H356.1333333333333 Q360.1333333333333,234 360.1333333333333,238 V244 Q360.1333333333333,248 356.1333333333333,248 H250 Z" class="s2"><title>TP4 Prefill step: 5.6%</title></path><text x="366.1333333333333" y="245" class="ink2" font-size="12" text-anchor="start" font-weight="400">5.6%</text><text x="236" y="288" class="ink" font-size="13" text-anchor="end" font-weight="600">Decode step</text><text x="236" y="304" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">wall time, bs 8 (profile)</text><path d="M250,276 H318.76666666666665 Q322.76666666666665,276 322.76666666666665,280 V286 Q322.76666666666665,290 318.76666666666665,290 H250 Z" class="s1"><title>TP2 Decode step: 3.7%</title></path><text x="328.76666666666665" y="287" class="ink2" font-size="12" text-anchor="start" font-weight="400">3.7%</text><path d="M250,292 H432.8333333333333 Q436.8333333333333,292 436.8333333333333,296 V302 Q436.8333333333333,306 432.8333333333333,306 H250 Z" class="s2"><title>TP4 Decode step: 9.5%</title></path><text x="442.8333333333333" y="303" class="ink2" font-size="12" text-anchor="start" font-weight="400">9.5%</text><line x1="20" y1="322" x2="880" y2="322" class="grid" stroke-width="1"/><text x="236" y="346" class="ink" font-size="13" text-anchor="end" font-weight="600">E2E QPS, c8</text><text x="236" y="362" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">12000 in / 350 out</text><path d="M250,334 H306.9666666666667 Q310.9666666666667,334 310.9666666666667,338 V344 Q310.9666666666667,348 306.9666666666667,348 H250 Z" class="s1"><title>TP2 E2E QPS, c8: 3.1%</title></path><text x="316.9666666666667" y="345" class="ink2" font-size="12" text-anchor="start" font-weight="600">3.1%</text><path d="M250,350 H318.76666666666665 Q322.76666666666665,350 322.76666666666665,354 V360 Q322.76666666666665,364 318.76666666666665,364 H250 Z" class="s2"><title>TP4 E2E QPS, c8: 3.7%</title></path><text x="328.76666666666665" y="361" class="ink2" font-size="12" text-anchor="start" font-weight="600">3.7%</text><text x="236" y="404" class="ink" font-size="13" text-anchor="end" font-weight="600">E2E QPS, c12</text><text x="236" y="420" class="ink2" font-size="11.5" text-anchor="end" font-weight="400">12000 in / 350 out</text><path d="M250,392 H303.0333333333333 Q307.0333333333333,392 307.0333333333333,396 V402 Q307.0333333333333,406 303.0333333333333,406 H250 Z" class="s1"><title>TP2 E2E QPS, c12: 2.9%</title></path><text x="313.0333333333333" y="403" class="ink2" font-size="12" text-anchor="start" font-weight="600">2.9%</text><path d="M250,408 H348.26666666666665 Q352.26666666666665,408 352.26666666666665,412 V418 Q352.26666666666665,422 348.26666666666665,422 H250 Z" class="s2"><title>TP4 E2E QPS, c12: 5.2%</title></path><text x="358.26666666666665" y="419" class="ink2" font-size="12" text-anchor="start" font-weight="600">5.2%</text><text x="20" y="484" class="mut" font-size="11.5" text-anchor="start" font-weight="400">MI308X, SP + SDMA overlap on in both arms, bf16 communication. E2E: TP2 mean of 2 rounds, TP4 median of 4 rounds.</text></svg>