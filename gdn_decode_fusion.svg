<svg xmlns='http://www.w3.org/2000/svg' width='860' height='440' viewBox='0 0 860 440' role='img' aria-labelledby='t d' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<title id='t'>GDN decode fusion</title><desc id='d'>Seven decode kernels per GDN layer replaced by one FlyDSL kernel</desc>
<rect width='860' height='440' fill='#fcfcfb'/>
<text x='24' y='32' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='600'>GDN decode, one layer (TP2, batch 8, MI308X): 7 kernels to 2, Triton interface kept</text>
<text x='24' y='52' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Kernel time per layer from a torch profile of the serving decode step</text>
<text x='24' y='94' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='600'>Triton chain</text>
<rect x='170.0' y='78' width='92.5' height='26' rx='3' fill='#b9b8b2'/>
<text x='216.25' y='95' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>b/a copy x2</text>
<rect x='264.5' y='78' width='63.1' height='26' rx='3' fill='#b9b8b2'/>
<rect x='329.6' y='78' width='58.9' height='26' rx='3' fill='#b9b8b2'/>
<rect x='390.5' y='78' width='273.1' height='26' rx='3' fill='#b9b8b2'/>
<text x='527.05' y='95' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>packed recurrence</text>
<rect x='665.6' y='78' width='46.3' height='26' rx='3' fill='#b9b8b2'/>
<rect x='713.9' y='78' width='55.8' height='26' rx='3' fill='#b9b8b2'/>
<text x='777.6499999999999' y='95' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='600'>57 us</text>
<line x1='297.1' y1='105' x2='297.1' y2='116' stroke='#8a8985'/>
<text x='297.05' y='141' font-size='10' fill='#52514e' text-anchor='middle' font-weight='normal'>cat(q, k, v)</text>
<line x1='360.1' y1='105' x2='360.1' y2='116' stroke='#8a8985'/>
<text x='360.05' y='128' font-size='10' fill='#52514e' text-anchor='middle' font-weight='normal'>causal_conv1d_update</text>
<line x1='689.7' y1='105' x2='689.7' y2='116' stroke='#8a8985'/>
<text x='689.7499999999999' y='128' font-size='10' fill='#52514e' text-anchor='middle' font-weight='normal'>z copy</text>
<line x1='742.8' y1='105' x2='742.8' y2='116' stroke='#8a8985'/>
<text x='742.7749999999999' y='141' font-size='10' fill='#52514e' text-anchor='middle' font-weight='normal'>gated RMSNorm</text>
<text x='24' y='187' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='600'>FlyDSL</text>
<rect x='170' y='170' width='165.0' height='26' rx='3' fill='#2a78d6'/>
<text x='253.47500000000002' y='187' font-size='11' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>fused decode</text>
<rect x='337.0' y='170' width='55.8' height='26' rx='3' fill='#b9b8b2'/>
<line x1='365.8' y1='197' x2='365.8' y2='208' stroke='#8a8985'/>
<text x='365.82500000000005' y='220' font-size='10' fill='#52514e' text-anchor='middle' font-weight='normal'>gated RMSNorm (unchanged)</text>
<text x='400.70000000000005' y='187' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='600'>21.4 us</text>
<text x='460.70000000000005' y='187' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>(36 layers: 2.17 to 0.77 ms per decode step, step -10%)</text>
<text x='24' y='250' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='600'>Inside the fused kernel (one workgroup = one token x one v-head, 4 waves)</text>
<circle cx='34' cy='270' r='8' fill='#2a78d6'/><text x='34' y='274' font-size='10' fill='#fcfcfb' text-anchor='middle' font-weight='600'>1</text>
<text x='50' y='274' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>Scalar s_load of slot index / gates; all 16 dwordx4 fp32 state loads per lane issued first</text>
<circle cx='34' cy='290' r='8' fill='#2a78d6'/><text x='34' y='294' font-size='10' fill='#fcfcfb' text-anchor='middle' font-weight='600'>2</text>
<text x='50' y='294' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>Unpack + conv update from the in_proj output; q/k conv state shared by 3 v-heads is shifted once by the</text>
<text x='50' y='314' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>last reader (self-resetting atomic arrival counter, CUDA-graph safe)</text>
<circle cx='34' cy='330' r='8' fill='#2a78d6'/><text x='34' y='334' font-size='10' fill='#fcfcfb' text-anchor='middle' font-weight='600'>3</text>
<text x='50' y='334' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>K-dim reductions with DPP (quad_perm, row_half_mirror, row_mirror): no LDS round trips</text>
<circle cx='34' cy='350' r='8' fill='#2a78d6'/><text x='34' y='354' font-size='10' fill='#fcfcfb' text-anchor='middle' font-weight='600'>4</text>
<text x='50' y='354' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>State load + store with the nt cache policy: the in-place write-back of just-read lines</text>
<text x='50' y='374' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>is the bound on MI308X; nt cuts it ~25% (see the second figure)</text>
<circle cx='34' cy='390' r='8' fill='#2a78d6'/><text x='34' y='394' font-size='10' fill='#fcfcfb' text-anchor='middle' font-weight='600'>5</text>
<text x='50' y='394' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>Writes o [B, 1, HV, V] like the Triton kernel plus a contiguous z; the model's own gated RMSNorm</text>
<text x='50' y='414' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>runs as before (an in-kernel norm variant, 17.5 us, is available via norm_weight=)</text>
</svg>
