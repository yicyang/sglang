<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="2000" height="1480" fill="#fcfcfb"/><text x="36" y="58" font-size="30" fill="#0b0b0b" font-weight="bold" text-anchor="start">Qwen3.5-35B-A3B TP2 prefill over SDMA: where each all-reduce overlaps</text><text x="36" y="98" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">one full-attention layer, one rank, kernel order and times from a TP2 32k-token prefill trace (TP0); widths not to scale</text><text x="36" y="172" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start">Baseline (#117)</text><text x="36" y="210" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">two all-reduces per layer, each an RCCL kernel (ncclDevKernel) on the compute stream, 2.9 ms each at 32k tokens</text><text x="150" y="290" font-size="18" fill="#52514e" font-weight="normal" text-anchor="end">compute</text><rect x="170" y="260" width="150" height="58" rx="7" fill="#dcdad5"/><text x="245.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">attn / GDN</text><rect x="330" y="260" width="120" height="58" rx="7" fill="#dcdad5"/><text x="390.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">o_proj</text><rect x="460" y="260" width="170" height="58" rx="7" fill="#1baf7a"/><text x="545.0" y="286.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">AR (rccl)</text><text x="545.0" y="304.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">2.95 ms</text><rect x="640" y="260" width="150" height="58" rx="7" fill="#dcdad5"/><text x="715.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">add + norm</text><rect x="800" y="260" width="150" height="58" rx="7" fill="#dcdad5"/><text x="875.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">MoE</text><rect x="960" y="260" width="170" height="58" rx="7" fill="#1baf7a"/><text x="1045.0" y="286.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">AR (rccl)</text><text x="1045.0" y="304.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">2.91 ms</text><rect x="1140" y="260" width="150" height="58" rx="7" fill="#dcdad5"/><text x="1215.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">add + norm</text><rect x="1300" y="260" width="170" height="58" rx="7" fill="#dcdad5"/><text x="1385.0" y="295.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">in_proj (next)</text><text x="36" y="420" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start">This PR - after attention: o_proj -&gt; all-reduce -&gt; add + norm -&gt; MoE, chunk by chunk</text><text x="36" y="458" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">each o_proj chunk&#x27;s partial sum goes to the peer right after its GEMM; each landed chunk is summed, normed and run through the MoE</text><text x="150" y="574" font-size="18" fill="#52514e" font-weight="normal" text-anchor="end">compute</text><text x="150" y="694" font-size="18" fill="#52514e" font-weight="normal" text-anchor="end">SDMA</text><rect x="170" y="540" width="130" height="58" rx="7" fill="#dcdad5"/><text x="235.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">attn / GDN</text><rect x="310" y="540" width="110" height="58" rx="7" fill="#dcdad5"/><text x="365.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">o_proj c0</text><rect x="430" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="462" y="540" width="110" height="58" rx="7" fill="#dcdad5"/><text x="517.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">o_proj c1</text><rect x="582" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="614" y="540" width="110" height="58" rx="7" fill="#dcdad5"/><text x="669.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">o_proj c2</text><rect x="734" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="766" y="540" width="110" height="58" rx="7" fill="#dcdad5"/><text x="821.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">o_proj c3</text><rect x="886" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="918" y="540" width="86" height="58" rx="7" fill="#eb6834"/><text x="961.0" y="566.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">wait c0</text><text x="961.0" y="584.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">22us</text><rect x="1014" y="540" width="170" height="58" rx="7" fill="#dcdad5"/><text x="1099.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c0</text><rect x="1194" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="1226" y="540" width="170" height="58" rx="7" fill="#dcdad5"/><text x="1311.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c1</text><rect x="1406" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="1438" y="540" width="170" height="58" rx="7" fill="#dcdad5"/><text x="1523.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c2</text><rect x="1618" y="540" width="22" height="58" rx="7" fill="#eb6834"/><rect x="1650" y="540" width="170" height="58" rx="7" fill="#dcdad5"/><text x="1735.0" y="575.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c3</text><text x="1205.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">wait c1</text><text x="1417.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">wait c2</text><text x="1629.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">wait c3</text><text x="441.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push c0</text><line x1="441.0" y1="602" x2="464" y2="654" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="458" y="660" width="456" height="58" rx="7" fill="#2a78d6"/><text x="686.0" y="695.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy c0 -&gt; peer</text><text x="593.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push c1</text><line x1="593.0" y1="602" x2="1020" y2="654" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1014" y="660" width="170" height="58" rx="7" fill="#2a78d6"/><text x="1099.0" y="695.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy c1 -&gt; peer</text><text x="745.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push c2</text><line x1="745.0" y1="602" x2="1232" y2="654" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1226" y="660" width="170" height="58" rx="7" fill="#2a78d6"/><text x="1311.0" y="695.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy c2 -&gt; peer</text><text x="897.0" y="530" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push c3</text><line x1="897.0" y1="602" x2="1444" y2="654" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1438" y="660" width="170" height="58" rx="7" fill="#2a78d6"/><text x="1523.0" y="695.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy c3 -&gt; peer</text><line x1="458" y1="742" x2="458" y2="752" stroke="#52514e" stroke-width="1.6"/><line x1="458" y1="752" x2="1608" y2="752" stroke="#52514e" stroke-width="1.6"/><line x1="1608" y1="742" x2="1608" y2="752" stroke="#52514e" stroke-width="1.6"/><text x="1033.0" y="776" font-size="17" fill="#52514e" font-weight="normal" text-anchor="middle" font-style="italic">c0 runs under the remaining o_proj chunks, c1..c3 under the previous chunk&#x27;s MoE; thin orange = push / wait (4-5 us once landed)</text><text x="36" y="860" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start">This PR - after the MoE: the same pipeline into the next layer</text><text x="36" y="898" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">each MoE chunk&#x27;s partial sum goes out right after it; the next layer&#x27;s add + norm run per chunk, then in_proj reads all rows</text><text x="150" y="1014" font-size="18" fill="#52514e" font-weight="normal" text-anchor="end">compute</text><text x="150" y="1134" font-size="18" fill="#52514e" font-weight="normal" text-anchor="end">SDMA</text><rect x="170" y="980" width="170" height="58" rx="7" fill="#dcdad5"/><text x="255.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c0</text><rect x="350" y="980" width="22" height="58" rx="7" fill="#eb6834"/><rect x="382" y="980" width="170" height="58" rx="7" fill="#dcdad5"/><text x="467.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c1</text><rect x="562" y="980" width="22" height="58" rx="7" fill="#eb6834"/><rect x="594" y="980" width="170" height="58" rx="7" fill="#dcdad5"/><text x="679.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c2</text><rect x="774" y="980" width="22" height="58" rx="7" fill="#eb6834"/><rect x="806" y="980" width="170" height="58" rx="7" fill="#dcdad5"/><text x="891.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">norm + MoE c3</text><rect x="986" y="980" width="22" height="58" rx="7" fill="#eb6834"/><rect x="1018" y="980" width="100" height="58" rx="7" fill="#eb6834"/><text x="1068.0" y="1006.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">wait m3</text><text x="1068.0" y="1024.0" font-size="15" fill="#ffffff" font-weight="normal" text-anchor="middle">381us</text><rect x="1128" y="980" width="300" height="58" rx="7" fill="#dcdad5"/><text x="1278.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">add + norm c0..c3 (next)</text><rect x="1438" y="980" width="190" height="58" rx="7" fill="#dcdad5"/><text x="1533.0" y="1015.0" font-size="17" fill="#0b0b0b" font-weight="normal" text-anchor="middle">in_proj (next)</text><text x="361.0" y="970" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push m0</text><line x1="361.0" y1="1042" x2="388" y2="1094" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="382" y="1100" width="170" height="58" rx="7" fill="#2a78d6"/><text x="467.0" y="1135.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy m0 -&gt; peer</text><text x="573.0" y="970" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push m1</text><line x1="573.0" y1="1042" x2="600" y2="1094" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="594" y="1100" width="170" height="58" rx="7" fill="#2a78d6"/><text x="679.0" y="1135.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy m1 -&gt; peer</text><text x="785.0" y="970" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push m2</text><line x1="785.0" y1="1042" x2="812" y2="1094" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="806" y="1100" width="170" height="58" rx="7" fill="#2a78d6"/><text x="891.0" y="1135.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy m2 -&gt; peer</text><text x="997.0" y="970" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle">push m3</text><line x1="997.0" y1="1042" x2="1024" y2="1094" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1018" y="1100" width="100" height="58" rx="7" fill="#2a78d6"/><text x="1068.0" y="1135.0" font-size="17" fill="#ffffff" font-weight="normal" text-anchor="middle">copy m3</text><line x1="382" y1="1182" x2="382" y2="1192" stroke="#52514e" stroke-width="1.6"/><line x1="382" y1="1192" x2="976" y2="1192" stroke="#52514e" stroke-width="1.6"/><line x1="976" y1="1182" x2="976" y2="1192" stroke="#52514e" stroke-width="1.6"/><text x="679.0" y="1216" font-size="17" fill="#52514e" font-weight="normal" text-anchor="middle" font-style="italic">m0..m2 run under the next MoE chunks; m3 has no compute after it and is the one exposed wait</text><text x="36" y="1290" font-size="19" fill="#0b0b0b" font-weight="normal" text-anchor="start">Not overlapped: attention / GDN and the next layer&#x27;s in_proj. Left exposed per layer: the first chunk&#x27;s wait (~22 us) and the last MoE chunk&#x27;s copy (~380 us),</text><text x="36" y="1322" font-size="19" fill="#0b0b0b" font-weight="normal" text-anchor="start">vs 5.9 ms of RCCL per layer on #117: this layer goes from 16.1 ms to 11.6 ms. rank 0 rows + rank 1 rows keep the replicas bit-identical.</text><text x="36" y="1354" font-size="19" fill="#0b0b0b" font-weight="normal" text-anchor="start">Chunk count follows the batch: 4 chunks from 16384 tokens (shown), 2 from 8192, smaller batches keep the RCCL all-reduce (host cost per chunk).</text><rect x="36" y="1410" width="34" height="24" rx="3" fill="#dcdad5"/><text x="82" y="1429" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">compute kernel</text><rect x="276" y="1410" width="34" height="24" rx="3" fill="#eb6834"/><text x="322" y="1429" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">mori push / wait kernel (compute stream)</text><rect x="802" y="1410" width="34" height="24" rx="3" fill="#2a78d6"/><text x="848" y="1429" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">SDMA copy (copy engine, under compute)</text><rect x="1306" y="1410" width="34" height="24" rx="3" fill="#1baf7a"/><text x="1352" y="1429" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">RCCL all-reduce (exposed)</text></svg>